<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vetic Pet Care - Browser Calling</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Twilio Voice JS SDK v2 (the old js/client/v1.x SDK is deprecated -> "Client version not supported"). -->
    <script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.18.3/dist/twilio.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f7f6; margin: 0; }
        .container { background-color: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h1 { color: #2c3e50; margin-bottom: 10px; font-size: 24px; }
        p { color: #7f8c8d; margin-bottom: 30px; font-size: 14px; }
        .status { margin-bottom: 20px; font-weight: bold; color: #e67e22; min-height: 20px; }
        button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; transition: all 0.3s ease; width: 100%; margin-bottom: 15px; font-weight: 600; }
        #make-call { background-color: #27ae60; color: white; }
        #make-call:hover:not(:disabled) { background-color: #2ecc71; }
        #end-call { background-color: #c0392b; color: white; display: none; }
        #end-call:hover { background-color: #e74c3c; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vetic Pet Care</h1>
        <p>Click below to test the AI Agent directly from your browser.</p>
        <div id="status" class="status">Initializing...</div>
        <button id="make-call" disabled>Make Call</button>
        <button id="end-call">End Call</button>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const makeCallBtn = document.getElementById('make-call');
        const endCallBtn = document.getElementById('end-call');

        let device;
        let activeCall;

        function setStatus(text, color) {
            statusDiv.innerText = text;
            statusDiv.style.color = color;
        }

        async function fetchToken() {
            const response = await fetch('/token');
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            return data.token;
        }

        async function init() {
            try {
                const token = await fetchToken();

                // v2: the Device does not auto-register; construct, wire events, then register().
                device = new Twilio.Device(token, {
                    codecPreferences: ['opus', 'pcmu'],
                });

                device.on('registered', () => {
                    setStatus('Ready to call', '#27ae60');
                    makeCallBtn.disabled = false;
                });

                device.on('error', (error) => {
                    setStatus('Error: ' + (error && error.message ? error.message : error), '#c0392b');
                    console.error('Twilio.Device Error:', error);
                });

                // Refresh the token before it expires so long sessions don't drop.
                device.on('tokenWillExpire', async () => {
                    try { device.updateToken(await fetchToken()); }
                    catch (e) { console.error('Token refresh failed:', e); }
                });

                await device.register();
            } catch (err) {
                setStatus('Failed to initialize: ' + err.message, '#c0392b');
                console.error(err);
            }
        }

        function wireCall(call) {
            activeCall = call;
            call.on('accept', () => {
                setStatus('Call connected', '#2980b9');
                makeCallBtn.style.display = 'none';
                endCallBtn.style.display = 'block';
            });
            const reset = (label) => {
                setStatus(label, '#f39c12');
                makeCallBtn.style.display = 'block';
                endCallBtn.style.display = 'none';
                activeCall = null;
            };
            call.on('disconnect', () => reset('Call ended'));
            call.on('cancel', () => reset('Call cancelled'));
            call.on('reject', () => reset('Call rejected'));
            call.on('error', (error) => {
                console.error('Call Error:', error);
                setStatus('Call error: ' + (error && error.message ? error.message : error), '#c0392b');
            });
        }

        makeCallBtn.onclick = async () => {
            if (!device) return;
            try {
                setStatus('Connecting...', '#e67e22');
                // v2: device.connect() is async and resolves to a Call you bind events on.
                const call = await device.connect({ params: {} });
                wireCall(call);
            } catch (err) {
                setStatus('Could not start call: ' + err.message, '#c0392b');
                console.error(err);
            }
        };

        endCallBtn.onclick = () => {
            if (device) device.disconnectAll();
        };

        // Initialize on load
        init();
    </script>
</body>
</html>
